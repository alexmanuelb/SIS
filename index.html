<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack - Student Information System</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Style para sa view password button */
  .password-container {
    position: relative;
    width: 100%;
  }
  .password-container input {
    padding-right: 45px; /* Para hindi matakpan ng icon yung text */
  }
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #5c0000; /* MAROON COLOR */
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .toggle-password:hover {
    color: #800000; /* Mas maliwanag na maroon pag hover */
  }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="landing-page">
  
  <!-- TOP NAVBAR -->
  <header class="landing-nav">
    <div class="logo-area">
      <img src="logo.png" alt="EduTrack Logo" style="height: 40px; width: auto;">
      <h1 style="font-size: 24px; font-weight: 800; margin: 0; margin-left: 10px; background: linear-gradient(90deg, #ffcccc, #ffffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        EduTrack
      </h1>
    </div>
  </header>

  <!-- MAIN CONTENT SPLIT -->
  <main class="landing-content">
    <div class="landing-left">
      <h1 class="hero-title">
        <span style="color: #111;">Student</span><br>
        <span style="color: #5c0000;">Information<br>System</span>
      </h1>
    </div>

    <div class="landing-right">
      <div class="login-box-modern">
        
        <!-- Role Toggle -->
        <div style="display:flex; gap:10px; margin-bottom: 25px;">
          <button id="btn-role-faculty" class="btn tab-btn active" onclick="setLoginRole('Faculty')" style="flex:1;">Faculty</button>
          <button id="btn-role-student" class="btn tab-btn" onclick="setLoginRole('Student')" style="flex:1;">Student</button>
        </div>

        <!-- Inputs -->
        <div class="field" style="margin-bottom: 15px;">
            <label style="font-weight: 600; font-size: 13px; color: #444;">Username</label>
            <input id="loginUser" type="text" placeholder="Enter username" style="padding: 12px; font-size: 15px; width: 100%; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        
        <div class="field" style="margin-bottom: 25px;">
            <label style="font-weight: 600; font-size: 13px; color: #444;">Password</label>
            <div class="password-container">
                <input id="loginPass" type="password" placeholder="Enter password" style="padding: 12px; font-size: 15px; width: 100%; border: 1px solid #ccc; border-radius: 6px;">
                
                <!-- SVG Eye Icons -->
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <!-- Default: Eye with Slash (Hidden) -->
                    <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    
                    <!-- Open Eye (Nakatago sa umpisa) -->
                    <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Log In Button -->
        <button class="btn" onclick="doLogin()" style="width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; background: #5c0000; font-weight: 700; color: white;">Log In →</button>
      </div>
    </div>
  </main>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appScreen">
  <header class="topbar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="logo.png" alt="EduTrack Logo" style="height: 35px; width: auto;">
      <h1 style="font-size: 18px; font-weight: bold; margin: 0;">EduTrack</h1>
    </div>
    <div class="userbox">
      <span id="whoami"></span>
    </div>
  </header>
  
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
