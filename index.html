<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack SIS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #f4f4f4; }
  .login-screen { display: flex; align-items: center; justify-content: center; height: 100vh;
    background: linear-gradient(135deg, #5c0000, #800000); }
  .login-box { background: white; padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .login-box h1 { color: #5c0000; text-align: center; margin-bottom: 25px; font-size: 24px; }
  .login-box label { font-size: 13px; color: #555; font-weight: bold; }
  .login-box input { width: 100%; padding: 10px; margin: 6px 0 15px; border: 1px solid #ccc; border-radius: 6px; }
  .login-box button { width: 100%; padding: 12px; background: #800000; color: white; border: none;
    border-radius: 6px; font-weight: bold; cursor: pointer; }
  .login-box button:hover { background: #5c0000; }
  #appScreen { display: none; height: 100vh; flex-direction: row; }
  #sidebar { width: 230px; background: #5c0000; color: white; padding: 15px; display: flex; flex-direction: column; }
  #sidebar button { background: transparent; border: none; color: #ffcccc; padding: 10px; text-align: left;
    cursor: pointer; border-radius: 5px; font-size: 14px; }
  #sidebar button:hover { background: #800000; color: white; }
  #sidebar .logout-btn { margin-top: auto; background: white; color: #5c0000; font-weight: bold; }
  #main { flex: 1; padding: 20px; overflow-y: auto; }
  .topbar { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px;
    display: flex; justify-content: space-between; }
  .panel { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
  .panel h2 { color: #5c0000; margin-bottom: 15px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; text-align: left; }
  th { background: #5c0000; color: white; }
  .btn { padding: 8px 14px; background: #800000; color: white; border: none;
    border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn.secondary { background: #ccc; color: #333; }
  .folder { background: #f9eaea; padding: 10px; margin: 6px 0; border-left: 4px solid #800000;
    border-radius: 4px; cursor: pointer; }
  .folder:hover { background: #f0d5d5; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: bold; color: #5c0000; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; }
  .badge.active { background: #d3f2dd; color: #186a3b; }
  .badge.inactive { background: #fde2e2; color: #9b1c1c; }
  .badge.pending { background: #fff3cd; color: #856404; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>EduTrack SIS</h1>
    <label>Username</label>
    <input id="loginUser" placeholder="Enter username">
    <label>Password</label>
    <input id="loginPass" type="password" placeholder="Enter password">
    <button onclick="doLogin()">Log In</button>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen">
  <div id="sidebar"></div>
  <div id="main">
    <div class="topbar">
      <div><b id="whoami"></b></div>
      <div id="clock"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
